name: Apply Ticket 02 Final

on:
  push:
    branches:
      - feature/02-timing-aware-scoring-final

permissions:
  contents: write

concurrency:
  group: ticket-02-final-backend
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[ticket-02-final]') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_DSN: host=localhost user=postgres password=postgres dbname=postgres port=5432 sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache: true

      - name: Apply the reviewed production patch
        run: |
          base64 -d .agent/ticket02-backend.patch.gz.b64 | gzip -d > /tmp/ticket02.patch
          git apply --check /tmp/ticket02.patch
          git apply /tmp/ticket02.patch

      - name: Format modified Go files
        run: |
          gofmt -w \
            internal/chore/api.go \
            internal/chore/handler.go \
            internal/chore/model/model.go \
            internal/chore/repo/repository.go \
            internal/chore/repo/scoring_test.go \
            internal/chore/scoring.go \
            internal/chore/scoring_test.go \
            internal/chore/validator.go \
            internal/database/scoring_migration_test.go

      - name: Check UTC discipline
        run: bash scripts/check-time-utc.sh

      - name: Run focused behavior and migration tests
        run: go test ./internal/chore/... ./internal/database -count=1

      - name: Run focused race tests
        run: go test -race ./internal/chore/... -count=1

      - name: Run complete test suite
        run: go test ./... -count=1

      - name: Vet Go packages
        run: go vet ./...

      - name: Remove temporary transport files
        run: |
          rm .agent/ticket02-backend.patch.gz.b64
          rm .github/workflows/apply-ticket-02-final.yml
          rmdir .agent 2>/dev/null || true

      - name: Validate final production diff
        run: |
          git diff --check
          test ! -e .agent/ticket02-backend.patch.gz.b64
          test ! -e .github/workflows/apply-ticket-02-final.yml

      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add timing-aware task scoring [ticket-02-final]'
          git push origin HEAD:feature/02-timing-aware-scoring-final
