name: Apply Ticket 02 Backend V2

on:
  push:
    branches:
      - feature/02-timing-aware-scoring-v2

permissions:
  contents: write

concurrency:
  group: ticket-02-backend-v2
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[ticket-02-v2]') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_DSN: host=localhost user=postgres password=postgres dbname=postgres port=5432 sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache: true

      - name: Reconstruct reviewed source patch
        run: |
          set -euo pipefail
          cat .agent/ticket02-backend-v2.part* > /tmp/ticket02-backend.b64
          base64 -d /tmp/ticket02-backend.b64 | gzip -d > /tmp/ticket02-backend.patch
          echo 'f555cf16adfd42b0f132e8182d77865de8191028e4a7f40ddaca88950c22544b  /tmp/ticket02-backend.patch' | sha256sum -c -
          git apply --check /tmp/ticket02-backend.patch
          git apply /tmp/ticket02-backend.patch
          test -f internal/chore/scoring.go
          test -f internal/chore/missed_scoring.go
          test -f internal/database/scoring_migration_test.go

      - name: Format modified Go files
        run: |
          gofmt -w \
            internal/chore/api.go \
            internal/chore/handler.go \
            internal/chore/missed_scoring.go \
            internal/chore/model/model.go \
            internal/chore/repo/repository.go \
            internal/chore/repo/scoring_test.go \
            internal/chore/scoring.go \
            internal/chore/scoring_test.go \
            internal/chore/validator.go \
            internal/database/scoring_migration_test.go \
            main.go

      - name: Check UTC discipline
        run: bash scripts/check-time-utc.sh

      - name: Run focused behavior and migration tests
        run: go test ./internal/chore/... ./internal/database -count=1

      - name: Run focused race tests
        run: go test -race ./internal/chore/... -count=1

      - name: Run complete test suite
        run: go test ./... -count=1

      - name: Vet Go packages
        run: go vet ./...

      - name: Remove patch transport
        run: |
          rm .agent/ticket02-backend-v2.part*
          rm .github/workflows/apply-ticket-02-v2.yml
          rmdir .agent 2>/dev/null || true

      - name: Validate production diff
        run: |
          git diff --check
          test ! -d .agent
          test ! -e .github/workflows/apply-ticket-02-v2.yml
          test -f internal/chore/scoring.go
          test -f internal/chore/missed_scoring.go

      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add timing-aware task scoring [ticket-02-v2]'
          git push origin HEAD:feature/02-timing-aware-scoring-v2
