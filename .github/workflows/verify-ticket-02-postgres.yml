name: Verify Ticket 02 PostgreSQL Migration

on:
  push:
    branches:
      - feature/02-timing-aware-scoring-real

permissions:
  contents: write

concurrency:
  group: ticket-02-postgres-verification
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[ticket-02-postgres]') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: donetick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d donetick_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache: true

      - name: Verify additive schema on PostgreSQL
        run: |
          mkdir -p .tmp-ticket02
          cat > .tmp-ticket02/main.go <<'GO'
          package main

          import (
              "fmt"

              chModel "donetick.com/core/internal/chore/model"
              cModel "donetick.com/core/internal/circle/model"
              syncModel "donetick.com/core/internal/sync/model"
              "gorm.io/driver/postgres"
              "gorm.io/gorm"
          )

          func main() {
              dsn := "host=127.0.0.1 user=postgres password=testpass dbname=donetick_test port=5432 sslmode=disable TimeZone=UTC"
              db, err := gorm.Open(postgres.Open(dsn), &gorm.Config{DisableForeignKeyConstraintWhenMigrating: true})
              if err != nil {
                  panic(err)
              }
              if err := db.AutoMigrate(
                  &cModel.UserCircle{},
                  &syncModel.SyncCursor{},
                  &chModel.Chore{},
                  &chModel.ChoreHistory{},
              ); err != nil {
                  panic(err)
              }
              required := map[string][]string{
                  "chores": {"timing_mode", "early_bonus"},
                  "chore_histories": {"base_points", "timing_adjustment", "recovery_points"},
              }
              for table, columns := range required {
                  for _, column := range columns {
                      var count int64
                      if err := db.Raw(`SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = ? AND column_name = ?`, table, column).Scan(&count).Error; err != nil {
                          panic(err)
                      }
                      if count != 1 {
                          panic(fmt.Sprintf("missing %s.%s", table, column))
                      }
                  }
              }
          }
          GO
          go run ./.tmp-ticket02
          rm -rf .tmp-ticket02

      - name: Re-run backend verification
        run: |
          bash scripts/check-time-utc.sh
          go test ./internal/chore/... -count=1
          go test ./... -count=1
          go vet ./...
          git diff --check

      - name: Record verification and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.scratch/gamified-life-system/issues/02-timing-aware-scoring.md')
          text = path.read_text()
          marker = '**Verification:** SQLite test suite + PostgreSQL 16 additive migration smoke test  '
          if marker not in text:
              text = text.replace('**Implementation:** `Jayvbooth/donetick#4` + `Jayvbooth/frontend#1`\n', '**Implementation:** `Jayvbooth/donetick#4` + `Jayvbooth/frontend#1`  \n' + marker + '\n')
          path.write_text(text)
          PY
          rm .github/workflows/verify-ticket-02-postgres.yml

      - name: Commit verification record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: verify ticket 02 PostgreSQL migration [ticket-02-postgres]'
          git push origin HEAD:feature/02-timing-aware-scoring-real
