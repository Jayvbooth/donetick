name: Close Ticket 02

on:
  push:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: close-ticket-02
  cancel-in-progress: false

jobs:
  close-ticket:
    if: ${{ !contains(github.event.head_commit.message, '[ticket-02-close]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark ticket complete
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.scratch/gamified-life-system/issues/02-timing-aware-scoring.md')
          text = path.read_text()
          if '**Status:** in-review' not in text:
              raise RuntimeError('Ticket 02 is not in review')
          text = text.replace('**Status:** in-review', '**Status:** done', 1)
          merged = '**Merged:** `Jayvbooth/donetick#4` + `Jayvbooth/frontend#1`  '
          if merged not in text:
              text = text.replace('**Implementation:** `Jayvbooth/donetick#4` + `Jayvbooth/frontend#1`  \n', '**Implementation:** `Jayvbooth/donetick#4` + `Jayvbooth/frontend#1`  \n' + merged + '\n')
          path.write_text(text)
          PY
          rm .github/workflows/close-ticket-02.yml
          git diff --check

      - name: Commit tracker closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: mark ticket 02 done [ticket-02-close]'
          git push origin HEAD:develop
