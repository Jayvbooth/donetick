name: Export Ticket 02 Script

on:
  push:
    branches:
      - feature/02-timing-aware-scoring

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ticket02-backend-script
          path: .agent/apply_02.py
          if-no-files-found: error
          retention-days: 1
