name: Fix Ticket 02 Applied Score

on:
  push:
    branches:
      - feature/02-timing-aware-scoring-v2

permissions:
  contents: write

concurrency:
  group: ticket-02-applied-score-fix
  cancel-in-progress: false

jobs:
  fix-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[ticket-02-clamp-fix]') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_DSN: host=localhost user=postgres password=postgres dbname=postgres port=5432 sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache: true

      - name: Apply exact-result fix
        run: |
          echo '7732b70b23d4dccc392316385ef0315f16ebcc662e09ed895a18095f240f6578  .agent/ticket02-clamp-fix.patch' | sha256sum -c -
          git apply --check .agent/ticket02-clamp-fix.patch
          git apply .agent/ticket02-clamp-fix.patch
          gofmt -w internal/chore/repo/repository.go internal/chore/repo/scoring_test.go

      - name: Check UTC discipline
        run: bash scripts/check-time-utc.sh

      - name: Run focused behavior and migration tests
        run: go test ./internal/chore/... ./internal/database -count=1

      - name: Run focused race tests
        run: go test -race ./internal/chore/... -count=1

      - name: Run complete test suite
        run: go test ./... -count=1

      - name: Vet changed package trees
        run: go vet ./internal/chore/... ./internal/database

      - name: Remove fix transport
        run: |
          rm .agent/ticket02-clamp-fix.patch
          rm .github/workflows/fix-ticket-02-applied-score.yml
          rmdir .agent 2>/dev/null || true

      - name: Validate final diff
        run: |
          git diff --check
          test ! -d .agent
          test ! -e .github/workflows/fix-ticket-02-applied-score.yml
          grep -q 'appliedTotal := score.Total' internal/chore/repo/repository.go
          grep -q 'require.Equal(t, -2, \*history.Points)' internal/chore/repo/scoring_test.go

      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: record the exact applied score [ticket-02-clamp-fix]'
          git push origin HEAD:feature/02-timing-aware-scoring-v2
