name: Diagnose Ticket 02 Focused Vet

on:
  push:
    branches:
      - feature/02-timing-aware-scoring-v2

permissions:
  contents: read

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache: true
      - name: Apply source patch
        run: |
          cat .agent/ticket02-backend-v2.part* > /tmp/ticket02-backend.b64
          base64 -d /tmp/ticket02-backend.b64 | gzip -d > /tmp/ticket02-backend.patch
          git apply /tmp/ticket02-backend.patch
          gofmt -w \
            internal/chore/api.go \
            internal/chore/handler.go \
            internal/chore/missed_scoring.go \
            internal/chore/model/model.go \
            internal/chore/repo/repository.go \
            internal/chore/repo/scoring_test.go \
            internal/chore/scoring.go \
            internal/chore/scoring_test.go \
            internal/chore/validator.go \
            internal/database/scoring_migration_test.go \
            main.go
      - name: Vet changed package trees
        run: go vet ./internal/chore/... ./internal/database
